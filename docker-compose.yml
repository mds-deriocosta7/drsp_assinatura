services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile  
    image: drsp-assinatura
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www/
    networks:
      - laravel-eti
    depends_on:
      - mysql_assinatura

  nginx_assinatura:
    image: nginx:alpine
    container_name: webserver
    restart: unless-stopped
    tty: true
    ports:
      - 8006:80
      - 446:443
    volumes:
      - ./:/var/www/
      - ./docker/nginx:/etc/nginx/conf.d/  
    networks:
      - laravel-eti

  mysql_assinatura:
    image: mysql:5.7.22
    command: mysqld --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    ports:
      - 3311:3306
    volumes:
      - ./.docker/mysql/dbdata:/var/lib/mysql
    networks:
      - laravel-eti

networks:
  laravel-eti:
    driver: bridge
